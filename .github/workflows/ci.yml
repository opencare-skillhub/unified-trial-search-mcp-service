name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the declared floor (`engines.node`): `node:sqlite` landed in
        # 22.5.0 but only stopped requiring `--experimental-sqlite` in 22.13.0.
        node: ['22.13.0', '24']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The suite is run several times because it covers deadline- and
      # concurrency-sensitive orchestration: a single green run there is weak
      # evidence, and a race that only shows up occasionally must fail the build.
      #
      # One test is opt-in (it needs a real ChiCTR corpus that CI does not have),
      # so it reports as skipped here; run it locally with
      # UNIFIED_TRIAL_TEST_CHICTR_CORPUS=<path to chictr_pancreatic.db>.
      - name: Test (3 runs, to catch timing races)
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            node --test test/*.test.mjs
          done

      # Proves the graceful-degradation path is real: on a Node that lacks
      # `node:sqlite` the ChiCTR corpus source must report a guided NEEDS_SETUP
      # instead of killing the process at import time.
      - name: Verify the CLI entry actually starts
        run: |
          node dist/src/cli/main.js help
          node dist/src/cli/main.js doctor --json || true

      # Guards a real regression class: nothing in the shipped tree may contain
      # a secret file, and no tool schema may accept a caller-supplied URL,
      # path, timeout, or credential.
      - name: Guard against committed secrets
        run: |
          if [ -f cookie.env ] || [ -f unified-trial-mcp.config.json ]; then
            echo "::error::A credential file was committed"
            exit 1
          fi
          echo "no credential files tracked"

      - name: Guard the closed-registry invariant
        run: node scripts/check-closed-registry.mjs

      # Packaging failures only surface after publishing, so they are checked
      # here: the bin must be executable and the command must work through a
      # symlink, which is how npm exposes it.
      - name: Verify the package is installable and runnable
        run: |
          test -x dist/src/cli/main.js || { echo "::error::bin is not executable"; exit 1; }
          mkdir -p /tmp/pack && cd /tmp/pack
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE" >/dev/null
          ./node_modules/.bin/unified-trial-mcp help | grep -q "unified-trial-mcp"
          echo "installed package runs through its bin symlink"
